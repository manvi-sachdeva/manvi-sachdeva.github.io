cv:
  name: Manvi Sachdeva
  label: Postdoctoral Fellow — Ultrafast Spectroscopy & Semiconductor Nanomaterials
  email: manvisachdeva121@gmail.com
  location: Roorkee, India (open to relocation worldwide)
  image: ""
  summary: >
    PhD physicist with 6+ years of hands-on experience in ultrafast spectroscopy, semiconductor nanomaterials synthesis
    (including thin-film deposition) and advanced materials characterization. Builds, aligns and troubleshoots complex
    laser-based and vacuum/controlled-atmosphere instrumentation. Strong in quantitative data analysis and kinetic
    modelling, and experienced in designing structured experiments that link process conditions to material and device performance.

  social_networks:
    - network: LinkedIn
      username: manvi-sachdeva-96ab27159

  sections:
    Experience:
      - company: Department of Chemistry, Indian Institute of Technology Roorkee
        position: Institute Postdoctoral Fellow
        location: Roorkee, India
        start_date: 2026-02
        end_date: present
        highlights:
          - Design and run experiments on photoactive semiconductor materials for energy conversion and photodetection, from material preparation (sputtered and thermally evaporated thin films) through characterization to performance evaluation.
          - Build, align and optimize laser-based measurement platforms operating under vacuum and controlled-atmosphere conditions. Define measurement protocols and acceptance criteria for repeatable data collection.
          - Diagnose and fix system- and sample-level issues affecting measurement stability, finding root causes across optics, electronics and the sample environment.

      - company: Institute of Nanoscience and Technology, IISER Mohali
        position: Senior Research Fellow (Doctoral Researcher)
        location: Mohali, India
        start_date: 2022-08
        end_date: 2026-02
        highlights:
          - Developed and refined hot-injection and hydrothermal synthesis routes, plus sputtering and thermal-evaporation thin-film deposition, for semiconductor nanocrystals, chalcogenide films and heterostructures. Varied precursor chemistry, temperature and time to tune stoichiometry, defect density and interfacial quality.
          - Ran structured experiment matrices across composition and process variables to define process windows and specification limits for reproducible material quality.
          - Characterized materials and interfaces with XRD, XPS/UPS, AFM, TEM and Raman, and correlated surface and bulk properties with optical and electrical behaviour.
          - Analyzed large multidimensional datasets with global/target analysis and kinetic modelling to extract carrier lifetimes, transfer rates and recombination pathways.
          - Published 5 first-author and 10 co-author peer-reviewed papers.

      - company: Institute of Nanoscience and Technology, IISER Mohali
        position: Junior Research Fellow
        location: Mohali, India
        start_date: 2020-08
        end_date: 2022-07
        highlights:
          - Set up baseline synthesis and characterization workflows for semiconductor nanomaterials, including reproducibility checks and batch-to-batch comparison.
          - Operated and maintained shared characterization tools (TCSPC, UV–Vis–NIR, XPS, XRD). Trained and supervised junior users and coordinated procurement of consumables and optics.

